[project]
name = "mr-sheven"
version = "0.1.0"
description = "酒类评测速查 - B站博主酒评数据管道与扫码查询服务"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Data validation
    "pydantic>=2.9.0",
    # ORM / Database
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    # Cache
    "cachetools>=5.5.0",
    "redis>=5.1.0",
    # HTTP client
    "httpx>=0.27.0",
    # Bilibili
    "bilibili-api-python>=16.0.0",
    # Fuzzy matching
    "rapidfuzz>=3.10.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"