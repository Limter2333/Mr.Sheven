name: mr_sheven
description: 酒类评测速查 - 扫码看博主评测
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Barcode scanner (ML Kit)
  mobile_scanner: ^5.1.0
  # HTTP client
  http: ^1.2.0
  # State management
  provider: ^6.1.0
  # Local storage
  shared_preferences: ^2.2.0
  # URL launcher (for video links)
  url_launcher: ^6.2.0
  # Camera (for future OCR)
  camera: ^0.11.0
  # Permissions
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/